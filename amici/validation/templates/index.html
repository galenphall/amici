<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amicus Brief Validation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Left Panel: Document List & Metadata -->
        <div class="panel left-panel">
            <h2>Documents</h2>
            <div class="document-list" id="documentList"></div>
            <div class="metadata" id="metadata"></div>
        </div>
        
        <!-- Center Panel: PDF Viewer -->
        <div class="panel center-panel">
            <div id="pdfViewer">
                <p class="placeholder">Select a document to view</p>
            </div>
        </div>
        
        <!-- Right Panel: Extracted Entities -->
        <div class="panel right-panel">
            <h2>Extracted Entities</h2>
            <div class="stats" id="stats"></div>
            
            <div class="tabs">
                <button class="tab active" onclick="switchTab('amici')">Amici</button>
                <button class="tab" onclick="switchTab('missed')">Missed</button>
                <button class="tab" onclick="switchTab('lawyers')">Lawyers</button>
            </div>
            
            <div id="amiciTab" class="tab-content active">
                <div class="entity-list" id="amiciList"></div>
            </div>
            
            <div id="missedTab" class="tab-content">
                <div class="add-missed">
                    <input type="text" id="missedName" placeholder="Amicus name">
                    <input type="text" id="missedCategory" placeholder="Category (optional)">
                    <button onclick="addMissedAmicus()">Add</button>
                </div>
                <div class="entity-list" id="missedList"></div>
            </div>
            
            <div id="lawyersTab" class="tab-content">
                <div class="entity-list" id="lawyersList"></div>
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
